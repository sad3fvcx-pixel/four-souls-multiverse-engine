[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "four-souls-multiverse-engine"
dynamic = ["version"]
description = "Deterministic engine for The Binding of Isaac: Four Souls"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

authors = [
    { name = "Evgenii" }
]

keywords = [
    "four-souls",
    "game-engine",
    "deterministic",
    "card-game",
    "python"
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

dependencies = []

[project.scripts]
fsme = "fsme.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    # Only so the tests can read .github/workflows/build.yml as structure
    # rather than as text. A release workflow that has twice been finished by
    # hand is worth a test that knows which job a step belongs to, and a
    # hand-rolled parser that got that subtly wrong would pass while the bug it
    # exists to catch came back. The engine still has no dependencies.
    "pyyaml>=6.0"
]

build = [
    "pyinstaller>=6.6"
]

# One version, kept in the package and read from here — see
# src/fsme/__init__.py for why it lives there and not the other way round.
[tool.setuptools.dynamic]
version = { attr = "fsme.__version__" }

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
fsme = [
    "py.typed",
    "web/static/*.html",
    "lab/desk/static/*.html",
    "carddata/**/*.json",
    "carddata/**/*.md",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = [
    "tests"
]

python_files = [
    "test_*.py"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B"
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
