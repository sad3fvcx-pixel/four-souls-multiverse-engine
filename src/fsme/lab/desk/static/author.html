<!doctype html>
<meta charset="utf-8">
<title>FSME — cards for Four Souls</title>
<style>
 :root { color-scheme: light dark; --line:#8884; --dim:#8889; --bad:#c0392b; --good:#1e8449; }
 body { font: 16px/1.55 system-ui, sans-serif; margin:0; padding:2rem 1.2rem 4rem;
        max-width:52rem; margin-inline:auto; }
 h1 { font-size:1.5rem; margin:0 0 .2rem; }
 h2 { font-size:1.15rem; margin:1.8rem 0 .6rem; }
 p.lead { color:var(--dim); margin:0 0 2rem; }
 .task { display:block; width:100%; text-align:left; border:1px solid var(--line);
         border-radius:.6rem; padding:1rem 1.1rem; margin:0 0 .7rem; background:none;
         font:inherit; color:inherit; cursor:pointer; }
 .task:hover { border-color:currentColor; }
 .task b { display:block; font-size:1.05rem; }
 .task span { color:var(--dim); font-size:.92rem; }
 label { display:block; margin:.8rem 0 .2rem; font-size:.92rem; }
 input, select, textarea { font:inherit; padding:.4rem .5rem; border:1px solid var(--line);
        border-radius:.35rem; background:none; color:inherit; width:100%; box-sizing:border-box; }
 textarea { min-height:4rem; }
 button { font:inherit; padding:.45rem .9rem; border:1px solid var(--line);
        border-radius:.35rem; background:none; color:inherit; cursor:pointer; }
 button.go { border-color:currentColor; font-weight:600; }
 .row { display:flex; gap:.6rem; align-items:flex-end; flex-wrap:wrap; }
 .row > * { flex:1; }
 .row > button { flex:0 0 auto; }
 .step { border:1px solid var(--line); border-radius:.5rem; padding:.8rem .9rem; margin:.6rem 0; }
 .step .head { display:flex; justify-content:space-between; align-items:center; gap:.5rem; }
 .kinds { display:grid; grid-template-columns:repeat(auto-fill,minmax(13rem,1fr)); gap:.6rem; }
 .problem { color:var(--bad); font-size:.92rem; margin:.35rem 0; }
 .ok { color:var(--good); }
 .card { border:1px solid var(--line); border-radius:.5rem; padding:1rem; }
 .card .kind { color:var(--dim); font-size:.85rem; text-transform:uppercase;
               letter-spacing:.06em; }
 .card .text { white-space:pre-wrap; margin-top:.5rem; }
 .muted { color:var(--dim); font-size:.9rem; }
 .back { background:none; border:none; color:inherit; cursor:pointer; padding:0;
         font:inherit; opacity:.7; margin-bottom:1rem; }
 .list { list-style:none; padding:0; margin:0; }
 .list li { border-bottom:1px solid var(--line); padding:.55rem 0; display:flex;
            justify-content:space-between; gap:.6rem; align-items:center; }
 .moment { margin:.3rem 0; }
 hr { border:none; border-top:1px solid var(--line); margin:2rem 0 1rem; }
 .need { color:var(--bad); font-size:.78rem; text-transform:uppercase;
         letter-spacing:.06em; margin-left:.35rem; }
 .nested { border-left:2px solid var(--line); padding-left:.8rem; margin:.4rem 0 .4rem .2rem; }
 .deep { margin:.6rem 0; }
 .deep > summary { cursor:pointer; font-size:.92rem; }
 .deep textarea { font-family:ui-monospace, monospace; font-size:.88rem; min-height:6rem; }
 label.flag { display:flex; gap:.45rem; align-items:center; }
 select[multiple] { height:auto; }
 :disabled { opacity:.45; }
 p.problem:empty { display:none; }
</style>

<div id="page"></div>

<script>
const api = async (path, body) => {
  const options = body === undefined ? {} :
    { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body) };
  const answer = await fetch(path, options);
  return answer.json();
};

let can = null;          // what the engine can do
let state = {};          // the card being made
const page = document.getElementById("page");
const el = (html) => { page.innerHTML = html; };
const esc = (s) => String(s ?? "").replace(/[<>&"]/g, c =>
  ({ "<":"&lt;", ">":"&gt;", "&":"&amp;", '"':"&quot;" }[c]));

// ---------------------------------------------------------------- home

async function home() {
  const { sets, where } = await api("/api/sets");
  const cards = sets.reduce((n, s) => n + s.cards.length, 0);
  el(`
    <h1>FSME</h1>
    <p class="lead">Make cards for Four Souls and watch the game play them.</p>
    <button class="task" onclick="startCard()">
      <b>Make a card</b><span>Start something new.</span></button>
    <button class="task" onclick="mine()">
      <b>My cards</b><span>${cards} card${cards === 1 ? "" : "s"} in
      ${sets.length} set${sets.length === 1 ? "" : "s"}.</span></button>
    <button class="task" onclick="location.href='/play'">
      <b>Watch a game</b><span>See the engine play, with your cards in it.</span></button>
    <hr>
    <button class="task" onclick="location.href='/advanced'">
      <b>Everything else</b><span>Runs, studies, reports — the tools for
      measuring, once a card works.</span></button>
    <p class="muted">Your sets are kept in ${esc(where)}</p>`);
}

// ------------------------------------------------------------- my cards

async function mine() {
  const { sets } = await api("/api/sets");
  el(`<button class="back" onclick="home()">← back</button>
      <h1>My cards</h1>` +
    (sets.length ? sets.map(s => `
      <h2>${esc(s.name)}</h2>
      <ul class="list">${s.cards.length
        ? s.cards.map(c => `<li><span>${esc(c)}</span></li>`).join("")
        : '<li><span class="muted">No cards yet.</span></li>'}</ul>`).join("")
      : `<p class="muted">You have not made a set yet.</p>`) +
    `<p><button class="go" onclick="startCard()">Make a card</button></p>`);
}

// ------------------------------------------------------- making a card

async function startCard() {
  if (!can) can = await api("/api/capabilities");
  const { sets } = await api("/api/sets");
  state = { set: sets[0]?.id || "", name: "", kind: "", text: "",
            numbers: {}, ability: { trigger: "on_play", effects: [], targets: [] } };
  if (!sets.length) return newSet();
  chooseKind();
}

async function newSet() {
  el(`<button class="back" onclick="home()">← back</button>
      <h1>Name your set</h1>
      <p class="lead">A set is a box of cards. Call it whatever you like —
        you can make more later.</p>
      <label for="n">What is it called?</label>
      <input id="n" placeholder="My First Set" autofocus>
      <p id="err" class="problem"></p>
      <p><button class="go" onclick="createSet()">Make it</button></p>`);
  document.getElementById("n").addEventListener("keydown",
    e => { if (e.key === "Enter") createSet(); });
}

async function createSet() {
  const name = document.getElementById("n").value;
  const made = await api("/api/sets/new", { name });
  if (made.error) { document.getElementById("err").textContent = made.error; return; }
  state.set = made.id;
  chooseKind();
}

function chooseKind() {
  el(`<button class="back" onclick="home()">← back</button>
      <h1>What kind of card?</h1>
      <div class="kinds">${can.kinds.map(k => `
        <button class="task" onclick="pickKind('${k.id}')">
          <b>${esc(k.name)}</b><span>${esc(k.about)}</span></button>`).join("")}</div>`);
}

function pickKind(kind) { state.kind = kind; editor(); }

// ------------------------------------------------------------- the editor

function editor(problems = [], moments = []) {
  const kindName = can.kinds.find(k => k.id === state.kind)?.name || state.kind;
  el(`<button class="back" onclick="home()">← back</button>
    <h1>Your ${esc(kindName.toLowerCase())}</h1>

    <label for="name">What is it called?</label>
    <input id="name" value="${esc(state.name)}" placeholder="Lucky Penny"
           oninput="state.name=this.value; face()">

    <label for="text">What does the card say?</label>
    <textarea id="text" placeholder="Gain 3¢."
      oninput="state.text=this.value; face()">${esc(state.text)}</textarea>

    <h2>When does it happen?</h2>
    <select id="trigger" onchange="state.ability.trigger=this.value">
      ${can.triggers.filter(t => t.common).map(t =>
        `<option value="${t.id}" ${t.id === state.ability.trigger ? "selected" : ""}>
           ${esc(t.about)}</option>`).join("")}
      <optgroup label="less common">
      ${can.triggers.filter(t => !t.common).map(t =>
        `<option value="${t.id}" ${t.id === state.ability.trigger ? "selected" : ""}>
           ${esc(t.about)}</option>`).join("")}
      </optgroup>
    </select>

    <h2>What happens?</h2>
    <div id="steps">${state.ability.effects.map(stepHtml).join("")}</div>
    <p class="row">
      <button onclick="addStep()">＋ something happens</button>
      <button onclick="addBranch()">＋ depending on something</button>
    </p>

    <hr>
    <div class="row">
      <button class="go" onclick="save()">Save this card</button>
      <button onclick="tryIt()">Try it in a game</button>
    </div>
    <div id="says">
      ${problems.map(p => `<p class="problem">${esc(p)}</p>`).join("")}
      ${moments.map(m => `<p class="moment">${esc(m.what)}</p>`).join("")}
    </div>

    <h2>The card</h2>
    <div id="face"></div>`);
  face();
}

function stepHtml(step, index) {
  if (step.branch) {
    const c = step.branch.condition || {};
    return `<div class="step">
      <div class="head"><b>Depending on…</b>
        <button onclick="dropStep(${index})">remove</button></div>
      <select onchange="setCondition(${index}, this.value)">
        <option value="">— choose —</option>
        ${can.conditions.map(x => `<option value="${x.id}"
          ${x.id === c.id ? "selected" : ""}>${esc(x.about)}</option>`).join("")}
      </select>
      ${fieldsHtml(conditionFields(c.id), c.fields, c.groups,
                   `state.ability.effects[${index}].branch.condition.fields`,
                   `state.ability.effects[${index}].branch.condition.groups`)}
      <p class="muted">if it is true</p>
      ${innerHtml(index, "then")}
      <p class="muted">otherwise</p>
      ${innerHtml(index, "else")}
    </div>`;
  }
  const chosen = can.effects.find(e => e.id === step.id);
  return `<div class="step">
    <div class="head">
      <select onchange="setEffect(${index}, this.value)">
        <option value="">— choose what happens —</option>
        ${can.effects.filter(e => e.common).map(e => `<option value="${e.id}"
          ${e.id === step.id ? "selected" : ""}>${esc(e.about)}</option>`).join("")}
        <optgroup label="everything else">
        ${can.effects.filter(e => !e.common).map(e => `<option value="${e.id}"
          ${e.id === step.id ? "selected" : ""}>${esc(e.about)}</option>`).join("")}
        </optgroup>
      </select>
      <button onclick="dropStep(${index})">remove</button>
    </div>
    ${fieldsHtml(chosen ? chosen.fields : [], step.fields, step.groups,
                 `state.ability.effects[${index}].fields`,
                 `state.ability.effects[${index}].groups`)}
    ${aimHtml(chosen, step, `state.ability.effects[${index}]`)}
  </div>`;
}

// "Who does this happen to?" — offered only for effects that act on
// something, with the engine's own words for each choice.
function aimHtml(chosen, step, path) {
  if (!chosen || !chosen.needs_target) return "";
  const options = can.targets.filter(t => t.aimable);
  const common = options.filter(t => t.common && !t.after);
  const rest = options.filter(t => !t.common && !t.after);
  // Ones that mean nothing on their own. Offered, because the engine resolves
  // them like any other — "destroy what you just damaged" is one of these —
  // and offered apart, because picking one first would mean nothing.
  const after = options.filter(t => t.after);
  const one = (t) => `<option value="${t.id}" ${t.id === step.aim ? "selected" : ""}>
      ${esc(t.about)}</option>`;
  const picked = can.targets.find(t => t.id === step.aim);
  return `<label>Who or what does this happen to?</label>
    <select onchange="setAim('${path}', this.value)">
      <option value="">— the usual one for this card —</option>
      ${common.map(one).join("")}
      <optgroup label="everything else">${rest.map(one).join("")}</optgroup>
      <optgroup label="what an earlier step chose">${after.map(one).join("")}</optgroup>
    </select>
    ${picked ? fieldsHtml(picked.fields, step.aim_fields, step.aim_groups,
        `${path}.aim_fields`, `${path}.aim_groups`) : ""}`;
}

function innerHtml(index, branch) {
  const list = state.ability.effects[index].branch[branch] || [];
  return `<div>${list.map((step, i) => {
    const chosen = can.effects.find(e => e.id === step.id);
    return `<div class="step">
      <div class="head">
        <select onchange="setInner(${index},'${branch}',${i},this.value)">
          <option value="">— choose —</option>
          ${can.effects.filter(e => e.common).map(e => `<option value="${e.id}"
            ${e.id === step.id ? "selected" : ""}>${esc(e.about)}</option>`).join("")}
          <optgroup label="everything else">
          ${can.effects.filter(e => !e.common).map(e => `<option value="${e.id}"
            ${e.id === step.id ? "selected" : ""}>${esc(e.about)}</option>`).join("")}
          </optgroup>
        </select>
        <button onclick="dropInner(${index},'${branch}',${i})">remove</button>
      </div>
      ${fieldsHtml(chosen ? chosen.fields : [], step.fields, step.groups,
        `state.ability.effects[${index}].branch.${branch}[${i}].fields`,
        `state.ability.effects[${index}].branch.${branch}[${i}].groups`)}
      ${aimHtml(chosen, step,
        `state.ability.effects[${index}].branch.${branch}[${i}]`)}
    </div>`;
  }).join("")}
  <button onclick="addInner(${index},'${branch}')">＋ add</button></div>`;
}

// ------------------------------------------------------------- the fields
//
// One renderer for every parameter the engine has, driven entirely by what
// `/api/capabilities` says about it. There is no list of effects here and
// there must never be one: an effect the engine gains draws itself, and an
// effect whose metadata changes draws itself differently, because this reads
// `shown`, `role`, `kind`, `many`, `choices`, `required`, `unless` and `picks`
// and nothing else.
//
// `values` is what the author filled in and `groups` is what they pointed at;
// the two are kept apart because they become different things in the card.

function fieldsHtml(fields, values, groups, path, groupPath) {
  const list = fields || [];
  values = values || {};
  groups = groups || {};
  return list.map(f => {
    // A second name the engine also reads for a question already asked. Asking
    // it again would be asking the same thing twice and saying nothing about
    // which answer wins.
    if (f.shown === "spelling") return "";
    if (f.shown === "given") return givenHtml(f);
    if (f.shown === "group") return groupHtml(f, groups, groupPath);
    if (f.shown === "advanced") return structureHtml(f, values, path);
    return valueHtml(f, values, list, path);
  }).join("");
}

// Not a question. Some parameters take a thing the engine already holds — the
// only way to name a card is to be one — and some are the names FSME writes so
// that later steps can point back at what was chosen. Either way a box here
// would take an answer that is wrong or about to be overwritten, so the page
// says which it is instead. The words come from the metadata, not from here.
function givenHtml(f) {
  return `<p class="muted"><b>${esc(f.about)}</b> — ${esc(f.written)}.</p>`;
}

// A parameter that names something the ability picks out. Never a text box:
// the author chooses from the engine's own targets and the name is written
// behind them, which is the machinery the aim already uses.
function groupHtml(f, groups, groupPath) {
  const pick = groups[f.id] || {};
  const options = can.targets.filter(t => t.aimable && fits(t, f.picks));
  const one = (t) => `<option value="${t.id}" ${
      t.id === pick.id ? "selected" : ""}>${esc(t.about)}</option>`;
  const picked = can.targets.find(t => t.id === pick.id);
  const mine = `${groupPath}.${f.id}`;
  return `<label>${esc(f.about)}${needed(f)}</label>
    <select onchange="setPick('${groupPath}','${f.id}',this.value)">
      <option value="">${esc(nobody(f))}</option>
      ${options.filter(t => t.common && !t.after).map(one).join("")}
      <optgroup label="everything else"
        >${options.filter(t => !t.common && !t.after).map(one).join("")}</optgroup>
      <optgroup label="what an earlier step chose"
        >${options.filter(t => t.after).map(one).join("")}</optgroup>
    </select>
    ${picked ? `<div class="nested">${fieldsHtml(picked.fields, pick.fields,
        pick.groups, `${mine}.fields`, `${mine}.groups`)}</div>` : ""}`;
}

// Which of the engine's targets can answer a parameter that names players,
// cards, or anything the ability has already chosen.
function fits(target, picks) {
  if (picks === "players") return target.gives === "players" || target.gives === "mixed";
  if (picks === "cards") return target.gives === "cards" || target.gives === "mixed";
  return true;
}

function nobody(f) {
  return f.picks === "players"
    ? "— whoever is playing the card —"
    : "— whatever the card is aimed at —";
}

// The effect's own nested data. Shown as what it is rather than as a string:
// a structure typed into a text box arrives as text, and the effect is handed
// a sentence where it wanted a list of things to do.
function structureHtml(f, values, path) {
  const written = values[f.id];
  const shown = written === undefined ? "" : JSON.stringify(written, null, 1);
  return `<details class="deep">
    <summary>${esc(f.about)} — written out in full${needed(f)}</summary>
    <p class="muted">Not a single answer: this one is a piece of the card's own
      rules, so it is written the way a card file writes it.</p>
    <textarea spellcheck="false" data-deep="${esc(f.id)}"
      oninput="setStructure('${path}','${f.id}',this)">${esc(shown)}</textarea>
    <p class="problem" id="${note(path, f.id)}"></p>
  </details>`;
}

// Everything a person simply answers. `role` decides the control, `many`
// decides whether one answer or several, and `unless` decides whether the
// question is worth asking at all.
function valueHtml(f, values, siblings, path) {
  const value = values[f.id];
  const off = moot(f, values, siblings);
  const why = off ? `<p class="muted">Not used while
      <b>${esc(labelOf(siblings, f.unless))}</b> says what it says.</p>` : "";
  const dead = off ? "disabled" : "";
  // A field others depend on redraws the form, so the questions that no longer
  // apply stop being asked the moment the answer changes.
  const seen = siblings.some(o => o.unless === f.id);
  const put = (what) => `${seen ? "onchange" : "oninput"}="setField('${path}','${
      f.id}',${what},${seen})"`;

  if (f.many) return `<label>${esc(f.about)}${needed(f)}</label>${why}
    <select multiple size="${Math.min(8, Math.max(2, f.choices.length))}" ${dead}
      onchange="setMany('${path}','${f.id}',this)">
      ${f.choices.map(c => `<option ${
        (Array.isArray(value) ? value : []).includes(c) ? "selected" : ""
        }>${esc(c)}</option>`).join("")}
    </select>
    <p class="muted">More than one may be picked; none means every one of them.</p>
    <p class="problem" ${f.required ? 'data-needed="1"' : ""}
       id="${note(path, f.id)}">${blank(f, value)}</p>`;

  if (f.role === "switch") return `${why}<label class="flag"><input type="checkbox"
      style="width:auto" ${value === true ? "checked" : ""} ${dead}
      onchange="setField('${path}','${f.id}',this.checked,${seen})">
      ${esc(f.about)}</label>`;

  if (f.role === "which" && f.choices.length)
    return `<label>${esc(f.about)}${needed(f)}</label>${why}
    <select ${dead} onchange="setField('${path}','${f.id}',this.value,${seen})">
      <option value="">${esc(fallback(f))}</option>
      ${f.choices.map(c => `<option ${c === value ? "selected" : ""}
        >${esc(c)}</option>`).join("")}
    </select>
    <p class="problem" ${f.required ? 'data-needed="1"' : ""}
       id="${note(path, f.id)}">${blank(f, value)}</p>`;

  const number = f.role === "amount";
  const kept = value === undefined || value === null ? "" : value;
  const read = number ? "this.valueAsNumber"
    : f.role === "open" ? "guess(this.value)" : "this.value";
  return `<label>${esc(f.about)}${needed(f)}</label>${why}
    <input ${dead} ${number
      ? `type="number" ${f.least != null ? `min="${f.least}"` : ""}` : ""}
      placeholder="${esc(fallback(f))}" value="${esc(kept)}" ${put(read)}>
    ${f.role === "open"
      ? '<p class="muted">Any value at all — a number, true or false, or words.</p>'
      : ""}
    <p class="problem" ${f.required ? 'data-needed="1"' : ""}
       id="${note(path, f.id)}">${blank(f, value)}</p>`;
}

// Whether a parameter the engine says can be overridden currently is.
//
// A switch overrides when it is on. Anything else overrides when it holds one
// of the values the engine named, or — where it named none — any value at all.
// What counts as "holds" includes the effect's own default, because a box left
// empty is not a question left open: `move_cards` puts cards on the bottom
// unless told otherwise, and a depth from the top means nothing there.
function moot(f, values, siblings) {
  if (!f.unless) return false;
  const other = siblings.find(o => o.id === f.unless);
  if (!other) return false;
  const written = values[other.id];
  const now = written === undefined || written === "" ? other.otherwise : written;
  if (other.role === "switch") return now === true;
  if (f.unless_when.length) return f.unless_when.includes(String(now));
  return now !== undefined && now !== null && now !== "" && now !== false;
}

function labelOf(fields, id) {
  const f = fields.find(o => o.id === id);
  return f ? f.about : id;
}
function needed(f) { return f.required ? ' <span class="need">needed</span>' : ""; }
function blank(f, value) {
  return f.required && (value === undefined || value === "" || value === null)
    ? "This one has to be filled in." : "";
}
// What the effect does when the box is left empty, in the engine's own words.
function fallback(f) {
  if (f.required) return "— nothing yet —";
  if (f.otherwise === null || f.otherwise === undefined) return "— leave it out —";
  return `— ${f.otherwise} —`;
}
function note(path, id) {
  return ("need-" + path + "-" + id).replace(/[^A-Za-z0-9_-]/g, "_");
}
// A parameter the engine will not judge takes any value at all, so what is
// typed is read the way a card file would read it and kept as words otherwise.
function guess(written) {
  try { return JSON.parse(written); } catch (e) { return written; }
}

function conditionFields(id) {
  return (can.conditions.find(c => c.id === id) || {}).fields || [];
}

// -------------------------------------------------------------- editing

// The object a path points at, making the way to it if it is not there yet.
//
// Walked from the card being made rather than from the window. `state` is a
// script-scoped binding and not a property of anything, so starting at the
// window used to reach a second object of the same name — every answer landed
// in it, and the card kept none of them.
const at = (path) => {
  const steps = path.split(/[.\[\]]+/).filter(Boolean);
  if (steps.shift() !== "state") throw new Error("not a path into the card: " + path);
  return steps.reduce((o, k) => (o[k] ??= {}), state);
};

function setField(path, key, value, redraw) {
  at(path)[key] = value;
  if (redraw) return editor();
  told(path, key, value);
  face();
}

// Several answers rather than one. A parameter the engine describes as a list
// gets a list, even when only one thing is picked: the difference between
// "loot" and ["loot"] is invisible in a form and fatal in a card.
function setMany(path, key, box) {
  const picked = Array.from(box.selectedOptions).map(o => o.value);
  if (picked.length) at(path)[key] = picked; else delete at(path)[key];
  told(path, key, picked.length ? picked : undefined);
  face();
}

// Something the ability picks out, named behind the author's back.
function setPick(groupPath, key, target) {
  const groups = at(groupPath);
  if (target) groups[key] = { id: target, fields: {}, groups: {} };
  else delete groups[key];
  editor();
}

// The effect's own nested data, kept as the structure it is. Text that is not
// yet a structure is not stored as one: half-typed JSON is not a value, and
// writing it into the card as a string is how a structure becomes a sentence.
function setStructure(path, key, box) {
  const said = document.getElementById(note(path, key));
  const written = box.value.trim();
  if (!written) {
    delete at(path)[key];
    if (said) said.textContent = "";
    return face();
  }
  try {
    at(path)[key] = JSON.parse(written);
    if (said) said.textContent = "";
    face();
  } catch (e) {
    delete at(path)[key];
    if (said) said.textContent = "Not finished yet — " + e.message;
  }
}

// A required box that has been emptied says so without waiting for the server.
function told(path, key, value) {
  const said = document.getElementById(note(path, key));
  if (!said) return;
  const empty = value === undefined || value === "" || value === null
    || (Array.isArray(value) && !value.length);
  said.textContent = empty && said.dataset.needed ? "This one has to be filled in." : "";
}

function setEffect(i, id) {
  state.ability.effects[i] = { id, fields: {}, groups: {} }; editor();
}
function setAim(path, id) {
  const step = at(path);
  if (id) { step.aim = id; step.aim_fields = {}; step.aim_groups = {}; }
  else { delete step.aim; delete step.aim_fields; delete step.aim_groups; }
  editor();
}
function setInner(i, branch, j, id) {
  state.ability.effects[i].branch[branch][j] = { id, fields: {}, groups: {} };
  editor();
}
function setCondition(i, id) {
  state.ability.effects[i].branch.condition = { id, fields: {}, groups: {} };
  editor();
}
function addStep() {
  state.ability.effects.push({ id: "", fields: {}, groups: {} }); editor();
}
function addBranch() {
  state.ability.effects.push(
    { branch: {
        condition: { id: "", fields: {}, groups: {} }, then: [], else: [] } });
  editor();
}
function addInner(i, branch) {
  state.ability.effects[i].branch[branch].push({ id: "", fields: {}, groups: {} });
  editor();
}
function dropStep(i) { state.ability.effects.splice(i, 1); editor(); }
function dropInner(i, branch, j) {
  state.ability.effects[i].branch[branch].splice(j, 1); editor();
}

// ------------------------------------------------------- the card's face

async function face() {
  const kindName = can.kinds.find(k => k.id === state.kind)?.name || state.kind;
  const holder = document.getElementById("face");
  if (holder) {
    holder.innerHTML = `<div class="card">
      <div class="kind">${esc(kindName)}</div>
      <b>${esc(state.name || "Untitled")}</b>
      <div class="text">${esc(state.text || "")}</div>
      <div class="muted" id="reads"></div></div>`;
  }
  const said = await api("/api/cards/check", state);
  const reads = document.getElementById("reads");
  if (reads) {
    // A card too unfinished to build at all is not a ready card. Saying so
    // matters more here than anywhere: this is the line somebody reads to
    // decide whether they are done.
    reads.innerHTML = said.error
      ? `<div class="problem">${esc(said.error)}</div>`
      : said.problems && said.problems.length
      ? said.problems.map(p => `<div class="problem">${esc(plain(p))}</div>`).join("")
      : '<div class="ok">This card is ready.</div>';
  }
}

// Engine messages name a path through a file. A person did not write a file.
function plain(message) {
  const tail = message.split(": ").slice(-1)[0];
  return tail.charAt(0).toUpperCase() + tail.slice(1);
}

async function save() {
  const said = await api("/api/cards/save", state);
  if (said.error) return editor([said.error]);
  editor(said.problems.map(plain),
         said.saved ? [{ what: `Saved. ${state.name} is in your set.` }] : []);
}

async function tryIt() {
  const said = await api("/api/cards/try", state);
  if (said.error) return editor([said.error]);
  editor((said.problems || []).map(plain), said.moments || []);
}

home();
</script>
