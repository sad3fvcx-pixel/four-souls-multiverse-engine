// unless told otherwise, and a depth from the top means nothing there.
function moot(f, values, siblings) {
  if (!f.unless) return false;
  const other = siblings.find(o => o.id === f.unless);
  if (!other) return false;
  const written = values[other.id];
  const now = written === undefined || written === "" ? other.otherwise : written;
  if (other.role === "switch") return now === true;
  if (f.unless_when.length) return f.unless_when.includes(String(now));
  return now !== undefined && now !== null && now !== "" && now !== false;
}

// What a value says, where the engine has words for it. Sixty-six event names
// are a list somebody has to look up; the same list with these on it is a
// question they can answer.
function meant(f, choice) { return (f.means || {})[choice] || choice; }

// Why a question is not being asked, said with the answer that settled it.
//
// The old sentence put the other parameter's *description* where a subject
// belonged and never named the answer at all, which on every loot card came
// out as "Not used while which kind of card it is says what it says". A
// template that needs a value has to be given one: `unless` names the other
// question and `unless_when` names the answers, and both were already here.
function becauseOf(f, values, siblings) {
  const other = siblings.find(o => o.id === f.unless);
  if (!other) return "Not used, because of another answer.";

  const written = values[other.id];
  const now = written === undefined || written === "" ? other.otherwise : written;
  const said = meant(other, String(now));
  const asked = trimmed(asksOf(other));

  // A switch reads best quoted as the question it is. Anything else reads best
  // as the noun phrase — which is what `describes` is for, and the reason it
  // stayed a separate slot when `asks` was split out of it.
  if (other.role === "switch") return `Not used while “${asked}” is ticked.`;
  if (now === undefined || now === null || now === "")
    return `Not used, because of ${other.about}.`;

  return `Not used, because of ${other.about} — ${said}.`;
}

// A question with its mark taken off, so it can sit inside a sentence.
function trimmed(asked) { return String(asked || "").replace(/\s*\?\s*$/, ""); }

function labelOf(fields, id) {
  const f = fields.find(o => o.id === id);
  return f ? asksOf(f) : id;
}
// Said once. It used to be shouted beside the label *and* repeated underneath
// as a sentence, so a required field carried two notices and neither said more
// than the other.
function needed(f) {
  return f.required ? ' <span class="need">this one is required</span>' : "";
}
function blank(f, value) { return ""; }
// What the effect does when the box is left empty, in the engine's own words.
function fallback(f) {
  if (f.required) return "— nothing yet —";
  if (f.otherwise === null || f.otherwise === undefined || f.otherwise === "")
    return "— leave it out —";
  return `— ${f.otherwise} —`;
}
function note(path, id) {
  return ("need-" + path + "-" + id).replace(/[^A-Za-z0-9_-]/g, "_");
}
// A parameter the engine will not judge takes any value at all, so what is
// typed is read the way a card file would read it and kept as words otherwise.
function guess(written) {
  try { return JSON.parse(written); } catch (e) { return written; }
}

// -------------------------------------------------------------- editing

// The object a path points at, making the way to it if it is not there yet.
//
// Walked from the card being made rather than from the window. `state` is a
// script-scoped binding and not a property of anything, so starting at the
// window used to reach a second object of the same name — every answer landed
// in it, and the card kept none of them.
const at = (path, empty) => {
  const steps = path.split(/[.\[\]]+/).filter(Boolean);
  if (steps.shift() !== "state") throw new Error("not a path into the card: " + path);
  const last = steps.pop();
  const holder = steps.reduce((o, k) => (o[k] ??= {}), state);
  holder[last] ??= empty === undefined ? {} : empty;
  return holder[last];
};

function setField(path, key, value, redraw) {
  at(path)[key] = value;
  if (redraw) return drawn();
  told(path, key, value);
  face();
}

// Several answers rather than one. A parameter the engine describes as a list
// gets a list, even when only one thing is picked: the difference between
// "loot" and ["loot"] is invisible in a form and fatal in a card.
function setMany(path, key, box) {
  const picked = Array.from(box.selectedOptions).map(o => o.value);
  if (picked.length) at(path)[key] = picked; else delete at(path)[key];
  told(path, key, picked.length ? picked : undefined);
  face();
}

// Something the ability picks out, named behind the author's back.
function setPick(groupPath, key, target) {
  const groups = at(groupPath);
  const made = target ? { id: target, fields: {}, groups: {} } : null;
  const at_ = key.split(".");
  const last = at_.length > 1 ? Number(at_[at_.length - 1]) : NaN;

  // One of several, when the answer holds several. Which it is comes from the
  // key the renderer wrote, and the renderer got it from the model.
  if (!Number.isNaN(last)) {
    const name = at_.slice(0, -1).join(".");
    const held = Array.isArray(groups[name]) ? groups[name] : [];
    if (made) held[last] = made; else held.splice(last, 1);
    if (held.length) groups[name] = held.filter(Boolean); else delete groups[name];
    return drawn();
  }

  if (made) groups[key] = made; else delete groups[key];
  drawn();
}

// The effect's own nested data, kept as the structure it is. Text that is not
// yet a structure is not stored as one: half-typed JSON is not a value, and
// writing it into the card as a string is how a structure becomes a sentence.
function setStructure(path, key, box) {
  const said = document.getElementById(note(path, key));
  const written = box.value.trim();
  if (!written) {
    delete at(path)[key];
    if (said) said.textContent = "";
    return face();
  }
  try {
    at(path)[key] = JSON.parse(written);
    if (said) said.textContent = "";
    face();
  } catch (e) {
    delete at(path)[key];
    if (said) said.textContent = "Not finished yet — " + e.message;
  }
}

// A required box that has been emptied says so without waiting for the server.
function told(path, key, value) {
  const said = document.getElementById(note(path, key));
  if (!said) return;
  const empty = value === undefined || value === "" || value === null
    || (Array.isArray(value) && !value.length);
  // The label already says it is required; repeating it under the box was two
  // notices for one fact.
  said.textContent = "";
}

// What an effect acts on. Chosen once and written twice — the ability binds a
// group and the effect points at it — so choosing again starts the pair over.
function setAim(path, id) {
  const step = at(path);
  if (id) { step.aim = id; step.aim_fields = {}; step.aim_groups = {}; }
  else { delete step.aim; delete step.aim_fields; delete step.aim_groups; }
  drawn();
}

// One of a group, and only one: choosing another puts the last one away.
// Which parameters are in the group is asked of the shape being drawn, which
// is the one thing that knows — the same key means different things in
// different nodes.
function setOneOf(path, group, id, owner) {
  const here = at(path);
  for (const one of fieldsOf(owner)) {
    if (one.one_of === group && one.id !== id) delete here[one.id];
  }
  if (id) here[id] ??= "";
  drawn();
}

// Choosing a different way of giving a value starts that way empty, because
// what was written for one way is not an answer to another.
function setWay(path, key, which, owner) {
  const f = fieldsOf(owner).find(one => one.id === key) || { id: key, also: [] };
  const way = [f, ...f.also][Number(which)];
  const here = at(path);
  if (way.shaped_like) here[key] = {};
  else if (way.a_list_of) here[key] = [];
  else delete here[key];
  drawn();
}

// What the shape being drawn says its fields are. The shape is carried down
// from wherever the drawing started rather than guessed back out of the path,
// because a path says where a value lives and not what describes it.
const fieldsOf = (owner) => (shapeNamed(owner) || { fields: [] }).fields;

// A node of a known kind, made empty and filled in afterwards. A kind chosen
// out of a list starts with nothing chosen; a kind that is one shape is
// already the thing it is.
function addNode(kind, path) {
  const list = at(path, []);
  list.push({ id: kindOf(kind).of() ? "" : kind, fields: {}, groups: {} });
  drawn();
}
function dropNode(path, index) { at(path, []).splice(index, 1); drawn(); }
function moveNode(path, index, by) {
  const list = at(path, []);
  list.splice(index + by, 0, list.splice(index, 1)[0]);
  drawn();
}
function setNode(kind, path, index, id) {
  at(path, [])[index] = { id, fields: {}, groups: {} };
  drawn();
}

// ------------------------------------------------------- the card's face

async function face() {
  const kind = state.card.fields.type;
  const kindName = can.kinds.find(k => k.id === kind)?.name || kind || "card";
  const holder = document.getElementById("face");
  if (holder) {
    holder.innerHTML = `<div class="card">
      <div class="kind">${esc(kindName)}</div>
      <b>${esc(state.card.fields.name || "Untitled")}</b>
      <div class="text">${esc(printed())}</div>
      <div class="muted" id="reads"></div></div>`;
  }
  const said = await api("/api/cards/check", state);
  const reads = document.getElementById("reads");
  if (reads) {
    // A card too unfinished to build at all is not a ready card. Saying so
    // matters more here than anywhere: this is the line somebody reads to
    // decide whether they are done.
    reads.innerHTML = said.error
      ? `<div class="problem">${esc(said.error)}</div>`
      : said.problems && said.problems.length
      ? said.problems.map(p => `<div class="problem">${esc(plain(p))}</div>`).join("")
      : '<div class="ok">This card is ready.</div>';
  }
}

// Engine messages name a path through a file. A person did not write a file.
function plain(message) {
  const tail = message.split(": ").slice(-1)[0];
  return tail.charAt(0).toUpperCase() + tail.slice(1);
}

async function save() {
  const said = await api("/api/cards/save", state);
  if (said.error) return drawn([said.error]);
  // What the card is now, so keeping it again is not refused for the change
  // this just made. A refusal says nothing new about the card, so what is
  // held stays what it was and the person can look again.
  if (said.saved) state.opened = said.opened;
  const kept = editing ? "Kept" : "Saved";
  drawn(said.changed ? said.problems : said.problems.map(plain),
        said.saved
          ? [{ what: `${kept}. ${state.card.fields.name} is in your set.` }] : []);
}

async function tryIt() {
  const said = await api("/api/cards/try", state);
  if (said.error) return drawn([said.error]);
  drawn((said.problems || []).map(plain), said.moments || []);
}

home();
</script>
