name: build

# An executable cannot be cross-compiled, so each platform builds its own.
# Linux is built and smoke-tested on every push; Windows and macOS builds are
# asked for by hand or cut on a tag, because they cost minutes nobody needs on
# an ordinary commit.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy --strict src/fsme
      - run: pytest -q

  executable:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: dist/fsme
          - os: windows-latest
            binary: dist/fsme.exe
          - os: macos-latest
            binary: dist/fsme
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[build]"
      - run: pyinstaller packaging/fsme.spec
      - name: The build can find its own cards
        run: ${{ matrix.binary }} cards
        shell: bash
      - name: The build can play a game
        run: ${{ matrix.binary }} play --seed 3
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: fsme-${{ matrix.os }}
          path: dist/fsme*
