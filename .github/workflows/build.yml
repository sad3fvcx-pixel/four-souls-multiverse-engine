name: build

# An executable cannot be cross-compiled, so each platform builds its own.
# Linux is built and smoke-tested on every push; Windows and macOS builds are
# asked for by hand or cut on a tag, because they cost minutes nobody needs on
# an ordinary commit.

on:
  push:
    branches: ["**"]
    # Any tag, not just v-prefixed ones. `tags: ["v*"]` looks harmless and is
    # a trap: the 0.1.0 release was cut as `0.1.0`, matched nothing, and
    # produced no build at all. A release with no binaries on it fails
    # silently, because the release page looks finished either way.
    tags: ["*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy --strict src/fsme
      - run: pytest -q

  # What a stranger does: pip install, then run it somewhere else entirely.
  # Every step below runs outside the checkout on purpose — a build that
  # shipped no cards passes any test run from a directory that has content/
  # sitting in it, which is how the missing card data survived until somebody
  # installed the wheel into an empty environment by hand.
  installed:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          path: source
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install it the way a stranger would
        run: pip install ./source
        shell: bash

      - name: It carries its own cards
        working-directory: ${{ runner.temp }}
        run: fsme cards
        shell: bash

      - name: The tour a newcomer is told to run
        working-directory: ${{ runner.temp }}
        run: fsme demo --quick
        shell: bash
        timeout-minutes: 5

      # The one that catches a Windows fork bomb. Without freeze_support in the
      # entry point, a spawned worker restarts the whole program, and the check
      # that finds it has to actually ask for more than one process.
      - name: It can use more than one core
        working-directory: ${{ runner.temp }}
        run: fsme study --games 8 --players 2 --jobs 2
        shell: bash
        timeout-minutes: 5

  executable:
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: fsme
            asset: fsme-linux
          - os: windows-latest
            binary: fsme.exe
            asset: fsme-windows.exe
          - os: macos-latest
            binary: fsme
            asset: fsme-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[build]"
      - run: pyinstaller packaging/fsme.spec

      # Copied out of the checkout before anything is asked of it, for the same
      # reason as above: beside content/ every build looks like it works.
      - name: Take it somewhere with no cards in it
        run: cp dist/${{ matrix.binary }} "${{ runner.temp }}/${{ matrix.binary }}"
        shell: bash

      - name: The build can find its own cards
        working-directory: ${{ runner.temp }}
        run: ./${{ matrix.binary }} cards
        shell: bash

      - name: The build can play a game
        working-directory: ${{ runner.temp }}
        run: ./${{ matrix.binary }} play --seed 3
        shell: bash

      - name: The build can use more than one core
        working-directory: ${{ runner.temp }}
        run: ./${{ matrix.binary }} study --games 8 --players 2 --jobs 2
        shell: bash
        timeout-minutes: 10

      # Named for the platform it was built on before it leaves the runner, so
      # that the job which publishes never has to know how each platform names
      # its own binary. Three files called `fsme` would collide anyway.
      - name: Name it for the platform it was built on
        run: cp "dist/${{ matrix.binary }}" "${{ runner.temp }}/${{ matrix.asset }}"
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ runner.temp }}/${{ matrix.asset }}
          if-no-files-found: error

  # Actions artifacts expire and need a GitHub login to download, so they are no
  # use to somebody who came to a release page for a file to run. A tagged build
  # puts the binaries on the release itself.
  #
  # This is one job rather than a step in the matrix, and that is the point of
  # it. Pushing a tag creates a *tag*; it does not create a *release*, and
  # `gh release upload` against a tag with no release fails with "release not
  # found". Every tagged build did, twice, and was finished by hand.
  #
  # Making each matrix leg create the release instead would replace that with a
  # worse bug: three runners finish within seconds of each other, all three find
  # no release, and two of them fail creating one that now exists. So creating
  # and uploading happen once, here, after every platform has built something.
  release:
    needs: executable
    if: startsWith(github.ref, 'refs/tags/')

    runs-on: ubuntu-latest

    # The only job that writes anything.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      # The binaries come back through an artifact rather than straight off the
      # build runner. That loses the executable bit, and it does not matter: a
      # release asset never carried one anyway, however it was uploaded.
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Every platform built something
        run: |
          ls -l assets
          for asset in fsme-linux fsme-windows.exe fsme-macos; do
            test -f "assets/${asset}" || { echo "no ${asset} was built"; exit 1; }
          done
        shell: bash

      # Create it when it is missing, use it when it is not. An existing
      # release is left exactly as it is: its title and its notes belong to
      # whoever wrote them, and a workflow that rewrote them on every re-run
      # would be a different way of losing a release page.
      - name: Make sure the tag has a release to put them on
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"

          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "release ${tag} already exists — using it, and leaving its notes alone"
            exit 0
          fi

          notes="docs/RELEASE_NOTES_${tag#v}.md"
          written=(--generate-notes)

          if [ -f "${notes}" ]; then
            written=(--notes-file "${notes}")
          fi

          # --verify-tag so a typo makes a release for a tag that does not
          # exist impossible, rather than making an empty one nobody notices.
          if ! gh release create "${tag}" --title "${tag}" --verify-tag "${written[@]}"; then
            # Creating can fail because somebody published by hand between the
            # check above and this line. That is a fine outcome. Every other
            # reason it can fail is not, so the difference is asked for rather
            # than assumed — the alternative is a workflow that reports success
            # for a release it never made.
            if ! gh release view "${tag}" >/dev/null 2>&1; then
              echo "could not create a release for ${tag}, and there is none"
              exit 1
            fi

            echo "release ${tag} appeared while this step ran — using it"
          fi
        shell: bash

      - name: Put the binaries on it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            assets/fsme-linux \
            assets/fsme-windows.exe \
            assets/fsme-macos \
            --clobber
        shell: bash

      # A release page with no assets looks exactly like one whose build has
      # not finished, which is how a release shipped with nothing on it once
      # before. Asking the release what it has is the only way to know.
      - name: The release has all three of them
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          on_it=$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name')

          echo "on the release:"
          echo "${on_it}"

          for asset in fsme-linux fsme-windows.exe fsme-macos; do
            echo "${on_it}" | grep -qx "${asset}" \
              || { echo "${asset} never reached the release"; exit 1; }
          done
        shell: bash
